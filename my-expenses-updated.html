<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার খরচ · My Expenses</title>
<meta name="theme-color" content="#0E3B36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="আমার খরচ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F0;--card:#fff;--ink:#14201E;--mut:#6B7B77;--line:#DCE5E2;--hero:#0E3B36;--acc:#E8553D;--chip:#E3ECE9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1514;--card:#142220;--ink:#E8F0EE;--mut:#8FA39E;--line:#233633;--hero:#0A2C28;--chip:#1D312E}}
:root[data-theme="dark"]{--bg:#0C1514;--card:#142220;--ink:#E8F0EE;--mut:#8FA39E;--line:#233633;--hero:#0A2C28;--chip:#1D312E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;line-height:1.5}
button{font-family:inherit}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 100px 82px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top h1{font-size:19px;margin:0;font-weight:700}
.top small{display:block;color:var(--mut);font-size:12.5px;font-weight:400}
.mn{display:flex;align-items:center;background:var(--card);border-radius:99px;padding:2px;border:1px solid var(--line)}
.mn button{border:0;background:none;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.mn span{min-width:96px;text-align:center;font-weight:600;font-size:14px}
.hero{background:var(--hero);color:#F2F7F5;border-radius:28px;padding:22px;display:flex;align-items:center;gap:18px}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:23px;line-height:1.1}
.ring small{font-size:11px;font-weight:400;opacity:.7}
.hl{flex:1;min-width:0}
.hl .lb{font-size:13px;opacity:.75}
.hl .big{font-size:30px;font-weight:700;line-height:1.2;margin:0 0 6px}
.hl .row{display:flex;justify-content:space-between;font-size:13px;gap:8px;flex-wrap:wrap}
.hl button{margin-top:10px;border:1px solid rgba(255,255,255,.35);background:none;color:inherit;border-radius:99px;padding:3px 12px;font-size:12px;cursor:pointer}
.sec{margin-top:22px}
.sec h2{font-size:15px;margin:0 0 10px;font-weight:600}
.cats,.box{background:var(--card);border-radius:22px;padding:6px 16px;border:1px solid var(--line)}
.box{padding:16px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.cr{display:flex;align-items:center;gap:12px;padding:10px 0}
.cr+.cr{border-top:1px solid var(--line)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.cm{flex:1;min-width:0}
.cm .n{display:flex;justify-content:space-between;font-size:14px;font-weight:500}
.bar{height:6px;border-radius:9px;background:var(--chip);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.day{font-size:12.5px;color:var(--mut);margin:16px 4px 6px;display:flex;justify-content:space-between}
.it{background:var(--card);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);margin-bottom:8px}
.it .t{flex:1;min-width:0}
.it .t div:first-child{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.it .t div:last-child{font-size:12px;color:var(--mut)}
.it .a{font-weight:600;font-size:15px}
.it .x{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 6px}
.empty{text-align:center;color:var(--mut);padding:28px 10px;background:var(--card);border-radius:22px;border:1px dashed var(--line);font-size:14px}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:99px;padding:13px 22px;font-weight:600;font-size:16px;box-shadow:0 8px 24px rgba(232,85,61,.4);cursor:pointer;z-index:5}
.nav{position:fixed;left:0;top:0;bottom:0;width:66px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 3px 14px;z-index:6}
.nav div{display:flex;flex-direction:column;gap:8px;width:100%}
.nav button{flex:none;border:0;background:none;color:var(--mut);padding:8px 2px;border-radius:14px;font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;word-break:break-word;text-align:center}
.nav button span{font-size:21px}
.nav button.on{color:var(--acc);font-weight:600;background:var(--chip)}
.ov{position:fixed;inset:0;background:rgba(5,15,13,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}}
.sh h3{margin:0 0 14px;font-size:18px}
.amt{display:flex;align-items:center;gap:6px;font-size:36px;font-weight:700;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.amt input{border:0;background:none;color:var(--ink);font:inherit;width:100%;outline:none;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid transparent;background:var(--chip);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--card);font-weight:600}
.f{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 12px;font:inherit;font-size:15px;margin-bottom:10px}
.btn{width:100%;border:0;background:var(--hero);color:#fff;border-radius:16px;padding:13px;font-weight:600;font-size:16px;cursor:pointer;margin-top:4px}
.btn.g{background:none;color:var(--mut);margin-top:0}
.btn.d{background:none;color:var(--acc);border:1px solid var(--acc);font-size:14px;padding:10px;margin-top:8px}
.btn.r{background:var(--acc)}
.err{color:var(--acc);font-size:13px;min-height:20px}
.ok{color:#2E9E73}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:11px;font-size:14px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px}
.au{width:100%;max-width:400px}
.logo{width:64px;height:64px;border-radius:20px;background:var(--hero);display:grid;place-items:center;font-size:32px;margin:0 auto 10px}
.au h1{text-align:center;margin:0;font-size:26px}
.au p.s{text-align:center;color:var(--mut);margin:2px 0 18px;font-size:14px}
.au .box{padding:18px}
.au .lang{align-self:flex-end;width:160px;margin-bottom:14px}
.nt{font-size:12px;color:var(--mut);text-align:center;margin-top:12px}
.pr{display:flex;align-items:center;gap:12px}
.av{width:52px;height:52px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.st div{background:var(--chip);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut)}
.st b{display:block;font-size:15px;color:var(--ink)}
@media (max-width:480px){.hero{padding:16px;gap:12px}.ring{width:92px;height:92px}.ring .c{font-size:18px}.hl .big{font-size:23px}.wrap{padding-left:78px;padding-right:12px}}
</style>
</head>
<body>

<div id="auth" class="auth" hidden>
  <div class="seg lang" data-lg><button data-lang="en">English</button><button data-lang="bn">বাংলা</button></div>
  <div class="au">
    <div class="logo">💸</div>
    <h1 data-t="app"></h1>
    <p class="s" data-t="tag"></p>
    <div class="box">
      <div class="seg" style="margin-bottom:14px"><button id="mi" data-t="login"></button><button id="mu" data-t="signup"></button></div>
      <input class="f" id="an" data-p="name" autocomplete="name" maxlength="40">
      <input class="f" id="ae" data-p="email" type="email" autocomplete="email">
      <input class="f" id="ac" data-p="rcode" autocomplete="off" maxlength="12" hidden>
      <input class="f" id="ap" data-p="pw" type="password" autocomplete="current-password">
      <input class="f" id="a2" data-p="pw2" type="password" autocomplete="new-password">
      <div class="err" id="ar"></div>
      <button class="btn" id="as"></button>
      <button class="btn g" id="fl" data-t="forgot" style="margin-top:8px"></button>
      <button class="btn d" id="ax" data-t="noCode" hidden></button>
      <div class="nt" data-t="local"></div>
    </div>
  </div>
</div>

<div id="app" hidden>
<div class="wrap">
  <div id="v-home">
    <div class="top">
      <h1 style="display:flex;align-items:center;gap:10px"><span class="av" id="ha" style="width:40px;height:40px;font-size:17px;flex:none"></span><span><small id="hi"></small><span data-t="app"></span></span></h1>
      <div class="mn"><button id="pv" aria-label="‹">‹</button><span id="ml"></span><button id="nx" aria-label="›">›</button></div>

    <div class="hero">
      <div class="ring">

        <div class="c"><span id="pc"></span><small data-t="bdg"></small></div>
      </div>
      <div class="hl">
        <div class="lb" data-t="spent"></div>
        <p class="big" id="tt"></p>
        <div class="row"><span><span data-t="bdg"></span> <b id="bd"></b></span><span id="rm"></span></div>
        <button id="eb" data-t="editB"></button>
      </div>
    </div>
    <div class="sec"><h2 data-t="sumT"></h2><div class="box" id="sum"></div></div>
    <div class="sec"><h2 data-t="where"></h2><div class="cats" id="cats"></div></div>
    <div class="sec"><h2 data-t="txs"></h2><div id="list"></div></div>

  </div>

  <div id="v-set" hidden>
    <div class="top"><h1 data-t="setT"></h1></div>
    <div class="box"><div class="pr"><div class="av" id="sa"></div><div><b id="sn"></b><div id="se" style="color:var(--mut);font-size:13px"></div></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="chip" id="avb" data-t="chPh"></button><button class="chip" id="avr" data-t="rmPh"></button></div><input type="file" id="avf" accept="image/*" hidden><div class="err" id="ie"></div></div>
    <div class="box"><h3 data-t="lang"></h3><div class="seg" data-lg><button data-lang="en">English</button><button data-lang="bn">বাংলা</button></div></div>
    <div class="box"><h3 data-t="theme"></h3><div class="seg" id="thm"><button data-th="auto" data-t="tA"></button><button data-th="light" data-t="tL"></button><button data-th="dark" data-t="tD"></button></div></div>
    <div class="box"><h3 data-t="mBud"></h3><button class="btn" id="sb2"></button></div>
    <div class="box"><h3 data-t="rcT"></h3><div id="rcs" style="font-size:13px;color:var(--mut);margin-bottom:10px"></div><button class="btn" id="rcb" data-t="rcNew"></button></div>
    <div class="box"><h3 data-t="chPw"></h3>
      <input class="f" id="cp" type="password" data-p="curPw" autocomplete="current-password">
      <input class="f" id="np" type="password" data-p="newPw" autocomplete="new-password">
      <div class="err" id="pe"></div>
      <button class="btn" id="pb" data-t="upd"></button>
    </div>
    <button class="btn g" id="lo" data-t="logout" style="border:1px solid var(--line)"></button>
    <button class="btn d" id="rs" data-t="reset"></button>
    <button class="btn d" id="da" data-t="delAcc"></button>
  </div>
</div>
<button class="fab" id="add" data-t="addB"></button>
<div class="nav"><div>
  <button data-go="home"><span>🏠</span><em data-t="nHome" style="font-style:normal"></em></button>
  <button data-go="act"><span>🕘</span><em data-t="nAct" style="font-style:normal"></em></button>
  <button data-go="set"><span>⚙️</span><em data-t="nSet" style="font-style:normal"></em></button>
</div></div>
</div>

<div class="ov" id="o1"><div class="sh">
  <h3 data-t="newE"></h3>
  <div class="seg" id="tys" style="margin-bottom:14px"></div>
  <div class="amt">৳<input id="am" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div class="chips" id="subs" hidden></div>
  <div id="acl" style="font-size:12.5px;color:var(--mut);margin-bottom:6px"></div>
  <div class="chips" id="accs"></div>
  <input class="f" id="nt" data-p="note" maxlength="60">
  <input class="f" id="dt" type="date">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><button class="chip" id="pbt" type="button" data-t="photo"></button><img id="ppv" alt="" hidden style="width:44px;height:44px;border-radius:10px;object-fit:cover"><button class="chip" id="prm" type="button" hidden data-t="rmv"></button></div>

  <div class="err" id="er"></div>
  <button class="btn" id="sv" data-t="save"></button>
  <button class="btn g" data-close data-t="cancel"></button>
</div></div>
<div class="ov" id="o2"><div class="sh">
  <h3 data-t="mBud"></h3>
  <div class="amt">৳<input id="bi" type="text" inputmode="numeric" autocomplete="off"></div>
  <button class="btn" id="sb" data-t="save"></button>
  <button class="btn g" data-close data-t="cancel"></button>
</div></div>
<div class="ov" id="o3"><div class="sh">
  <h3 id="cq"></h3>
  <button class="btn r" id="cy" data-t="yes"></button>
  <button class="btn g" data-close data-t="cancel"></button>
</div></div>

<div class="ov" id="o5"><div class="sh"><h3 data-t="rcT"></h3><p data-t="rcD" style="font-size:14px;color:var(--mut);margin:0 0 14px"></p><div class="amt" id="rcv" style="font-size:30px;letter-spacing:3px;justify-content:center;user-select:all"></div><button class="btn" data-close data-t="saved"></button></div></div>
<div class="ov" id="o4" style="align-items:center"><img id="vim" alt="" style="max-width:94vw;max-height:84vh;border-radius:16px"></div>

function rcn(v){return String(v).toUpperCase().replace(/[^A-Z0-9]/g,'')}

async function resetPw(em,code,wipe){
  var er=$('ar'),pw=$('ap').value,u=users[em];
  if(!u){er.textContent=t('e_nouser');return}

  if(!wipe&&(!u.rh||await hp(rcn(code),u.rs)!==u.rh)){er.textContent=t(u.rh?'e_rc':'e_norc');return}
  u.salt=salt();u.hash=await hp(pw,u.salt);
  if(wipe){var d=ld('kh_d_'+em,null);if(d&&d.items)d.items.forEach(function(i){if(i.img)ip(em+':'+i.id,null).catch(function(){})});ip(em+':avatar',null).catch(function(){});try{localStorage.removeItem('kh_d_'+em)}catch(e){}delete u.rh;delete u.rs}
  sv('kh_users',users);$('ap').value=$('a2').value=$('ac').value='';mode='in';applyLang();er.className='err ok';er.textContent=t('pwOk');
}

$('as').onclick=async function(){
  var em=$('ae').value.trim().toLowerCase(),pw=$('ap').value,nm=$('an').value.trim(),er=$('ar');er.className='err';er.textContent='';
  if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent=t('e_email');return}
  if(!window.crypto||!crypto.subtle){er.textContent=t('e_c');return}
  try{
    if(mode==='fp'){await resetPw(em,$('ac').value,false);return}
    if(mode==='up'){
      if(!nm){er.textContent=t('e_name');return}
      if(pw.length<6){er.textContent=t('e_pw');return}
      if(pw!==$('a2').value){er.textContent=t('e_match');return}
      if(users[em]){er.textContent=t('e_exists');return}
      var s=salt();users[em]={name:nm,salt:s,hash:await hp(pw,s)};sv('kh_users',users);var rcode=await setRc(em);
      var old=Object.keys(users).length===1?ld('khoroch_v1',null):null;
      me=em;D=old&&old.items?{items:old.items,budget:old.budget||20000,log:[]}:{items:[],budget:20000,log:[]};
      lg('signup');
    }else{
      var u=users[em];
      if(!u||await hp(pw,u.salt)!==u.hash){er.textContent=t('e_bad');return}
      me=em;D=ld('kh_d_'+em,{items:[],budget:20000,log:[]});lg('login');
    }
    sv('kh_sess',me);saveD();$('ap').value=$('a2').value='';enter();if(rcode)showRc(rcode);
  }catch(e){er.textContent=t('e_c')}
};
